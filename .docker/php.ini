upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120

; Send PHP-level fatal errors to stderr so they show up in Render's log
; stream instead of disappearing into a file inside the container.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
